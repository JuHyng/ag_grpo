name: smoke

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check shell scripts
        run: bash -n train.sh scripts/*.sh
      - name: Check Python syntax
        run: |
          python -m py_compile \
            train.py \
            data_utils.py \
            diffu_grpo_config.py \
            diffu_grpo_trainer.py \
            ag_grpo_trainer.py \
            reward_func.py \
            reward_func_code.py \
            math500_utils.py
